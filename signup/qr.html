<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1b0c29">
  <meta name="robots" content="noindex">
  <title>QR להרשמה | במה פתוחה!</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #1b0c29 linear-gradient(140deg, #1b0c29, #421649 60%, #190a2a) fixed;
      color: #fff0d0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3vmin 16px;
    }
    h1 {
      font-size: clamp(30px, 6vmin, 64px);
      margin: 0 0 2vmin;
      color: #ff8536;
      text-shadow: 3px 3px #fa3e8f;
    }
    .qr {
      width: min(92vw, 72vh);
      background: #fff;
      border-radius: 24px;
      padding: 3vmin;
      box-shadow: 10px 12px #fa438d, 0 0 0 8px #ff8536;
    }
    .qr svg { display: block; width: 100%; height: auto; }
    .url {
      margin: 3vmin 0 0;
      font-size: clamp(16px, 3vmin, 30px);
      font-weight: 900;
      direction: ltr;
      overflow-wrap: anywhere;
    }
    .url a { color: #ffb663; text-decoration: none; }
    .sub { margin: 1vmin 0 0; font-size: clamp(14px, 2.4vmin, 22px); color: #e5c4d6; }
    @media print {
      body { background: #fff; color: #000; }
      h1 { color: #000; text-shadow: none; }
      .qr { box-shadow: none; border: 2px solid #000; }
      .url a { color: #000; }
      .sub { color: #333; }
    }
  </style>
</head>
